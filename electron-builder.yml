# macOS package (arm64, local): `npm run package`. Linux package (x64, CI): `npm run package:linux`.
# Docs: docs/Packaging.md.
appId: com.jbclaramonte.system-design-from-scratch
productName: System Design from Scratch
copyright: Copyright (c) 2026 Jean-Baptiste Claramonte. Apache-2.0.
# Package the Electron already in node_modules: no download, works offline.
electronDist: node_modules/electron/dist
directories:
  output: dist
  buildResources: build
# The app bundle ships only what runs: the electron-vite output (main and preload bundle their
# dependencies, the renderer is a Vite bundle) and the resources read at runtime. No node_modules:
# scripts/check-package.mjs fails if a bundle still requires a package.
files:
  - package.json
  - out/**
  - resources/**
  - '!**/node_modules/**'
  - '!**/.DS_Store'
asar: true
npmRebuild: false
mac:
  target:
    - target: dmg
      arch: arm64
    - target: dir
      arch: arm64
  category: public.app-category.education
  icon: build/icon.icns
  # Signed ad hoc ("-", no certificate), not notarized: personal use. The whole bundle is sealed
  # after electron-builder has added app.asar and edited Info.plist; Electron's own ad-hoc seal
  # no longer matches the edited bundle, and a copy with the quarantine attribute (browser
  # download) then opens as "damaged" (scripts/check-package.mjs verifies the signature).
  # Chromium LICENSES.chromium.html and Electron LICENSE live next to the Electron.app in
  # node_modules/electron/dist and are not part of the .app: they are copied into
  # Contents/Resources (the guard script requires them).
  identity: '-'
  hardenedRuntime: false
  extraResources:
    - from: node_modules/electron/dist/LICENSE
      to: LICENSE.electron
    - from: node_modules/electron/dist/LICENSES.chromium.html
      to: LICENSES.chromium.html
# Linux x64, built on a Linux host (CI, .github/workflows/package.yml). Unsigned, no auto-update.
# The Electron in node_modules (electronDist above) is the Linux one on a Linux host: never build
# this target from macOS. The same licenses as on macOS are copied into resources/ (the Electron
# distribution also leaves a copy next to the executable).
linux:
  target:
    - target: AppImage
      arch: x64
    - target: deb
      arch: x64
  category: Education
  # build/icons/<size>x<size>.png, generated by `npm run icon:build` from the same drawing as the
  # macOS icon.
  icon: build/icons
  synopsis: Learn system design from scratch
  description: Desktop app for learning system design from scratch, driving the Claude Code CLI.
  maintainer: Jean-Baptiste Claramonte
  # Window association: Electron uses package.json "desktopName" as app_id / WM_CLASS, and the
  # .desktop file takes the same name, so the window groups under the launcher entry and its icon.
  syncDesktopName: true
  # Linux file names carry no space (a .deb is installed with `apt install ./<file>`).
  artifactName: ${name}-${version}-${arch}.${ext}
  extraResources:
    - from: node_modules/electron/dist/LICENSE
      to: LICENSE.electron
    - from: node_modules/electron/dist/LICENSES.chromium.html
      to: LICENSES.chromium.html
dmg:
  sign: false
  writeUpdateInfo: false
# No auto-update: no publish provider, no latest-mac.yml.
publish: null
# File names carry no space: GitHub rewrites spaces in release asset names.
artifactName: ${name}-${version}-${arch}.${ext}
