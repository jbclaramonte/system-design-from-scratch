name: Package

# Builds the Linux x64 app (AppImage and deb) on an Ubuntu runner, checks the package, smoke-tests it
# under xvfb and uploads the artifacts. Manual, or on a version tag. Docs: docs/Packaging.md.
on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  linux:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci

      # xvfb: a virtual display for the smoke test. libfuse2t64: runs an AppImage without
      # extracting it. binutils: `ar`, used by the deb builder (fpm). The rest is what the Electron
      # binary links against (Chromium: NSS, GTK 3, ATK, CUPS, GBM, ALSA, X11 libraries); most of
      # it is already on the runner image, installing it makes the job independent of that.
      - name: Install system libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            xvfb xauth binutils libfuse2t64 xdg-utils \
            libnss3 libatk1.0-0t64 libatk-bridge2.0-0t64 libcups2t64 libdrm2 libgtk-3-0t64 \
            libgbm1 libasound2t64 libxss1 libxtst6 libxkbcommon0 libxcomposite1 libxdamage1 \
            libxfixes3 libxrandr2 libpango-1.0-0 libcairo2

      # Presence of the tldraw license key secret, never its value. Without it the build prints the
      # no-key warning, and the smoke test skips its tldraw checks (an unlicensed Design Canvas is
      # blank after 5 seconds).
      - name: Check the tldraw license key secret
        id: tldraw
        env:
          TLDRAW_KEY: ${{ secrets.VITE_TLDRAW_LICENSE_KEY }}
        run: |
          if [ -n "$TLDRAW_KEY" ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "::warning::Repository secret VITE_TLDRAW_LICENSE_KEY is not set: this package has an unusable Design Canvas."
          fi

      # install-electron (in the script) downloads the Electron binary; electron-builder packages
      # it, then the guard script (scripts/check-package.mjs --platform linux) runs.
      - name: Build the Linux package
        run: npm run package:linux
        env:
          VITE_TLDRAW_LICENSE_KEY: ${{ secrets.VITE_TLDRAW_LICENSE_KEY }}

      - name: Check the package
        run: node scripts/check-package.mjs --platform linux
        env:
          VITE_TLDRAW_LICENSE_KEY: ${{ secrets.VITE_TLDRAW_LICENSE_KEY }}

      # The sandbox helper must be owned by root with the setuid bit (electron-builder does not run
      # as root). Ubuntu 24.04 runners restrict unprivileged user namespaces (AppArmor), the other
      # way Chromium can sandbox, so without this the app aborts at startup. The smoke test keeps
      # the default sandbox (no --no-sandbox).
      - name: Set up the Chromium sandbox helper
        run: |
          sudo chown root:root dist/linux-unpacked/chrome-sandbox
          sudo chmod 4755 dist/linux-unpacked/chrome-sandbox
          ls -l dist/linux-unpacked/chrome-sandbox

      - name: Smoke test the packaged app
        run: xvfb-run -a npm run smoke:packaged -- --shots smoke-shots
        env:
          SMOKE_ALLOW_MISSING_TLDRAW_KEY: ${{ steps.tldraw.outputs.present != 'true' && '1' || '' }}

      - name: Upload the Linux packages
        uses: actions/upload-artifact@v7
        with:
          name: linux-x64
          path: |
            dist/*.AppImage
            dist/*.deb
          if-no-files-found: error
          retention-days: 14

      - name: Upload the smoke test screenshots
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: smoke-shots
          path: smoke-shots/
          if-no-files-found: ignore
          retention-days: 14
