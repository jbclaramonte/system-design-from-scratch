name: Pages

# Publishes the website (site/, plain HTML and CSS, no build step) to GitHub Pages at
# https://jbclaramonte.github.io/system-design-from-scratch/. On a push to main that touches
# site/, or by hand. The repository's Pages source must be set to "GitHub Actions" (Settings >
# Pages) once, by the owner. Docs: docs/Website.md.
on:
  push:
    branches: [main]
    paths:
      - 'site/**'
  workflow_dispatch:

permissions:
  contents: read

# One deployment at a time; a newer push replaces one still waiting, never one running.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      # Offline checks of the page: local links, images, no remote resource, attribution.
      - run: node scripts/check-site.mjs
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
